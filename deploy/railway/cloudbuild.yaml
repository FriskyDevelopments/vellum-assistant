steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --file
      - deploy/zeabur/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_TAG}
      - .
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_TAG}
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_TAG}
substitutions:
  _REGION: us-central1
  _REPOSITORY: vellum
  _IMAGE: vellum-assistant
  _TAG: manual
options:
  logging: CLOUD_LOGGING_ONLY
